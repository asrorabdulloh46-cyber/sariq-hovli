# GitHub'da APK'ni avtomatik yig'ish: repo -> Actions -> "APK yig'ish" -> Run workflow
# Serverni APK ichiga yozish uchun: Settings -> Secrets and variables -> Actions -> Variables -> SERVER_URL
name: APK yig'ish
on:
  workflow_dispatch:
  push:
    paths: ['client/**', 'apk/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - name: APK yig'ish
        working-directory: apk
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: ./build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SariqHovli-apk
          path: dist/SariqHovli.apk
