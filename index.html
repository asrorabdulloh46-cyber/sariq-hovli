<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Termiz GTA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'Segoe UI',sans-serif;color:#fff}

/* Canvas */
#c{display:block;width:100%;height:100%;touch-action:none}

/* Loading */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:#111;z-index:100;gap:12px}
#loading h1{font-size:2rem;font-weight:900;letter-spacing:2px;color:#f90}
#loading p{color:#aaa;font-size:0.95rem}
#loading.hide{display:none}

/* Ism ekrani */
#namescreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(0,0,0,0.88);z-index:90;gap:14px}
#namescreen h2{font-size:1.6rem;font-weight:800;color:#f90;letter-spacing:1px}
#namescreen input{padding:10px 16px;font-size:1.1rem;border:2px solid #f90;border-radius:8px;
  background:#222;color:#fff;outline:none;width:220px;text-align:center}
#namescreen select{padding:9px 14px;font-size:1rem;border:2px solid #666;border-radius:8px;
  background:#222;color:#fff;outline:none;width:220px}
#startbtn{padding:11px 32px;font-size:1.1rem;font-weight:700;background:#f90;color:#000;
  border:none;border-radius:9px;cursor:pointer;letter-spacing:1px;transition:opacity 0.2s}
#startbtn:hover{opacity:0.85}
#namescreen.hide{display:none}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
#hud.hide{display:none!important}
.hide{display:none!important}

/* Sog'liq */
#hp{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:1.5rem;font-weight:800;text-shadow:0 2px 6px #000;color:#ff8888}

/* Tezlik */
#speed{position:absolute;bottom:14px;right:14px;font-size:1.1rem;
  font-weight:700;color:#fff;text-shadow:0 2px 4px #000;text-align:right}

/* Wanted */
#wantedlevel{position:absolute;top:14px;right:14px;font-size:1.6rem;
  color:#ffaa00;text-shadow:0 2px 6px #000;letter-spacing:2px}

/* Qurol */
#weaponhud{position:absolute;bottom:60px;right:14px;text-align:right}
#weapon{font-size:0.95rem;color:#ccc;text-shadow:0 1px 4px #000}
#ammo{font-size:1.3rem;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}

/* Ping */
#ping{position:absolute;top:14px;left:14px;font-size:0.75rem;color:#888}

/* Minimap */
#minimap{position:absolute;top:40px;left:14px;border:2px solid rgba(255,255,255,0.25);
  border-radius:4px;image-rendering:pixelated}

/* Toast */
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.75);color:#fff;padding:9px 18px;border-radius:8px;
  font-size:0.95rem;text-align:center;pointer-events:none;opacity:0;
  transition:opacity 0.3s;max-width:70vw}
#toast.on{opacity:1}

/* Touch: joystick konteyner */
#ljoy-zone,#rjoy-zone{position:absolute;bottom:0;width:50%;height:220px;
  pointer-events:all;touch-action:none;display:none}
#ljoy-zone{left:0}
#rjoy-zone{right:0}
body.touch #ljoy-zone,body.touch #rjoy-zone{display:block}

/* Joystick ko'rsatkich */
.jpad{position:absolute;border-radius:50%;background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.18);pointer-events:none;transform:translate(-50%,-50%)}
.jpad.base{width:90px;height:90px}
.jpad.knob{width:42px;height:42px;background:rgba(255,255,255,0.22)}

/* Touch: steer zone */
#steer-zone{position:absolute;top:0;left:50%;width:50%;height:calc(100% - 220px);
  pointer-events:all;touch-action:none;display:none}
body.touch #steer-zone{display:block}

/* Touch tugmalar */
#touch-btns{position:absolute;bottom:0;right:50%;width:50%;height:220px;
  display:none;pointer-events:all}
body.touch #touch-btns{display:flex;align-items:center;justify-content:flex-end;
  gap:10px;padding:0 14px}
.tbtn{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);
  background:rgba(0,0,0,0.5);color:#fff;font-size:1.3rem;display:flex;
  align-items:center;justify-content:center;cursor:pointer;user-select:none;
  -webkit-user-select:none;touch-action:none}
.tbtn:active{background:rgba(255,200,0,0.4)}

/* E tugmasi / enter-exit car */
#btn-enter{position:absolute;right:14px;bottom:230px;pointer-events:all}
body.touch #btn-enter{display:flex}

/* Mashina gaz/tormoz */
#car-controls{position:absolute;bottom:0;right:0;width:50%;height:220px;
  display:none;align-items:center;justify-content:flex-end;gap:16px;padding:0 20px;
  pointer-events:none}
body.touch.inCar #car-controls{display:flex;pointer-events:all}

.crbtn{width:64px;height:64px;border-radius:12px;border:2px solid rgba(255,255,255,0.3);
  background:rgba(0,0,0,0.5);color:#fff;font-size:0.85rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
.crbtn:active{background:rgba(255,200,0,0.4)}

/* Xarita overlay */
#mapview{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:60;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#mapview.on{display:flex}
#mapview h3{color:#f90;font-size:1.2rem}
#bigmap{border:2px solid #444;border-radius:4px}

/* O'lik ekrani */
#deathscreen{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:80;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#deathscreen.on{display:flex}
#deathscreen h2{font-size:2rem;color:#ff4444;font-weight:900}
#respawnbtn{padding:11px 28px;font-size:1.1rem;font-weight:700;background:#f90;color:#000;
  border:none;border-radius:9px;cursor:pointer}

/* Chat */
#chatbox{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:none;background:rgba(0,0,0,0.7);border-radius:8px;overflow:hidden}
#chatbox input{padding:9px 14px;font-size:0.95rem;background:transparent;
  color:#fff;border:none;outline:none;width:280px}
#chatbox.on{display:block;pointer-events:all}
</style>
</head>
<body>
<!-- Loading -->
<div id="loading">
  <h1>TERMIZ GTA</h1>
  <p id="loadtxt">Xarita yuklanmoqda…</p>
</div>

<!-- Canvas -->
<canvas id="c"></canvas>

<!-- Ism ekrani -->
<div id="namescreen">
  <h2>🚗 Termiz GTA</h2>
  <input id="nameinput" maxlength="20" placeholder="Ismingiz" autocomplete="off" spellcheck="false">
  <select id="colorsel">
    <option value="0">🔴 Qizil</option>
    <option value="1">🔵 Ko'k</option>
    <option value="2">🟢 Yashil</option>
    <option value="3">🟡 Sariq</option>
    <option value="4">🟣 Binafsha</option>
    <option value="5">🟠 To'q sariq</option>
    <option value="6">⚪ Oq</option>
    <option value="7">⚫ Qora</option>
  </select>
  <button id="startbtn">O'ynash →</button>
</div>

<!-- HUD -->
<div id="hud">
  <!-- Wanted yulduzlari -->
  <div id="wantedlevel"></div>
  <!-- Ping -->
  <div id="ping"></div>
  <!-- Minimap -->
  <canvas id="minimap" width="160" height="120"></canvas>
  <!-- Sog'liq -->
  <div id="hp">❤ 100</div>
  <!-- Tezlik -->
  <div id="speed">0 km/h</div>
  <!-- Qurol -->
  <div id="weaponhud">
    <div id="weapon">Mushtlash</div>
    <div id="ammo">∞</div>
  </div>
  <!-- Toast xabar -->
  <div id="toast"></div>

  <!-- Touch joysticklar -->
  <div id="ljoy-zone">
    <div class="jpad base" id="ljoy-base" style="display:none;position:absolute"></div>
    <div class="jpad knob" id="ljoy-knob" style="display:none;position:absolute"></div>
  </div>
  <div id="rjoy-zone">
    <div class="jpad base" id="rjoy-base" style="display:none;position:absolute"></div>
    <div class="jpad knob" id="rjoy-knob" style="display:none;position:absolute"></div>
  </div>

  <!-- Steering zone (mashina) -->
  <div id="steer-zone"></div>

  <!-- Touch tugmalar (piyoda) -->
  <div id="touch-btns">
    <div class="tbtn" id="btn-jump" data-action="jump">↑</div>
    <div class="tbtn" id="btn-fire" data-action="attack_tap">🔫</div>
    <div class="tbtn" id="btn-enter" data-action="interact">🚗</div>
    <div class="tbtn" id="btn-wpn" data-action="nextweapon">⚙</div>
  </div>

  <!-- Mashina gaz/tormoz -->
  <div id="car-controls">
    <div class="crbtn" id="crbtn-brake">⬇<br><small>Tormoz</small></div>
    <div class="crbtn" id="crbtn-gas">⬆<br><small>Gaz</small></div>
  </div>
</div>

<!-- O'lik ekrani -->
<div id="deathscreen">
  <h2>O'ldingiz</h2>
  <button id="respawnbtn">Qayta tug'ilish (R)</button>
</div>

<!-- Chat -->
<div id="chatbox"><input id="chatinput" placeholder="Xabar yozing…" maxlength="100"></div>

<!-- Xarita view -->
<div id="mapview">
  <h3>Termiz xaritasi</h3>
  <canvas id="bigmap" width="600" height="400"></canvas>
  <small style="color:#666">M — yopish</small>
</div>

<script type="module" src="./game.js"></script>
<script>
// Loading xabarini game.js yuklanishi bilan o'chirish
window.addEventListener('load', () => {
  // map.json yuklanayotganda loading ko'rinadi
  // game.js ichida map.json fetch qilingandan keyin loading div yashiriladi
  setTimeout(() => {
    const ld = document.getElementById('loading');
    if (ld && !ld.classList.contains('hide')) {
      document.getElementById('loadtxt').textContent = 'Tayyor bo\'lishini kutayapti…';
    }
  }, 500);
});

// Respawn tugmasi
document.getElementById('respawnbtn').addEventListener('click', () => {
  window._gameRespawn && window._gameRespawn();
});

// Dead state hook — game.js dan chaqiriladi
window._onDead = () => {
  document.getElementById('deathscreen').classList.add('on');
};
window._onAlive = () => {
  document.getElementById('deathscreen').classList.remove('on');
};
</script>
</body>
</html>
